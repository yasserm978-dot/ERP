#bgDecor::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(18,22,26,.15), rgba(18,22,26,.62) 55%, var(--bg) 100%);
}
:root[data-theme="light"] #bgDecor::after{
  background:linear-gradient(180deg, rgba(243,242,238,.3), rgba(243,242,238,.8) 55%, var(--bg) 100%);
}
@keyframes bgKenBurns{
  0%{ transform:scale(1) translate(0,0); }
  50%{ transform:scale(1.12) translate(-1.5%,-1%); }
  100%{ transform:scale(1) translate(0,0); }
}
@media(prefers-reduced-motion: reduce){
  #bgDecor::before{ animation:none; }
}
.app, .auth-wrap{ position:relative; z-index:1; }
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}

/* ---------- Layout ---------- */
.app{display:flex; min-height:100vh;}
.sidebar{
  width:230px; flex-shrink:0;
  background:var(--surface);
  border-left:1px solid var(--border);
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh;
}
.brand{
  padding:22px 18px 16px;
  border-bottom:1px solid var(--border);
}
.brand-title{font-weight:900; font-size:17px; letter-spacing:.2px;}
.brand-sub{font-size:12px; color:var(--text-dim); margin-top:3px;}
nav{flex:1; padding:14px 10px; overflow-y:auto;}
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; border-radius:6px; cursor:pointer;
  color:var(--text-dim); font-size:14.5px; font-weight:500;
  border-right:3px solid transparent;
  margin-bottom:2px;
  transition:background .12s;
}
.nav-item svg{width:18px; height:18px; flex-shrink:0;}
.nav-item:hover{background:var(--surface-2); color:var(--text);}
.nav-item.active{
  background:var(--surface-2); color:var(--text);
  border-right-color:var(--accent);
}
.sidebar-foot{
  padding:14px 18px; border-top:1px solid var(--border);
  font-size:11.5px; color:var(--text-dim); display:flex; justify-content:space-between; align-items:center;
}
.theme-btn{
  background:none; border:1px solid var(--border); color:var(--text-dim);
  border-radius:5px; padding:5px 9px; cursor:pointer; font-size:11.5px; font-family:inherit;
}
.theme-btn:hover{color:var(--text); border-color:var(--text-dim);}

main{flex:1; min-width:0; padding:28px 32px 60px;}
.page{display:none;}
.page.active{display:block;}
.page-head{
  display:flex; justify-content:space-between; align-items:flex-end;
  margin-bottom:22px; flex-wrap:wrap; gap:12px;
}
.page-title{font-size:22px; font-weight:900;}
.page-desc{font-size:13px; color:var(--text-dim); margin-top:4px;}

.btn{
  background:var(--accent); color:#1B1503; border:none;
  padding:9px 18px; border-radius:6px; font-weight:700; font-size:13.5px;
  cursor:pointer; font-family:inherit;
}
.btn:hover{filter:brightness(1.08);}
.btn.secondary{
  background:transparent; color:var(--text); border:1px solid var(--border);
}
.btn.secondary:hover{border-color:var(--text-dim);}
.btn.danger{background:var(--bad); color:#fff;}
.btn.small{padding:5px 10px; font-size:12px; border-radius:5px;}

/* ---------- Dashboard cards ---------- */
.kpi-grid{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:14px; margin-bottom:26px;
}
.kpi{
  background:var(--surface); border:1px solid var(--border);
  border-right:3px solid var(--accent);
  border-radius:6px; padding:16px 18px;
}
.kpi.alert{border-right-color:var(--bad);}
.kpi.ok{border-right-color:var(--good);}
.kpi-label{font-size:12.5px; color:var(--text-dim); font-weight:500;}
.kpi-value{font-size:26px; font-weight:900; margin-top:6px;}
.kpi-sub{font-size:11.5px; color:var(--text-dim); margin-top:4px;}

.progress-track{
  height:6px; background:var(--surface-2); border-radius:3px; overflow:hidden; margin-top:8px;
}
.progress-fill{height:100%; background:var(--accent); border-radius:3px;}

.section-title{font-size:15px; font-weight:700; margin:26px 0 12px;}

/* ---------- Table ---------- */
.table-wrap{
  background:var(--surface); border:1px solid var(--border); border-radius:6px; overflow:hidden;
}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
thead th{
  text-align:right; padding:11px 14px; background:var(--surface-2);
  color:var(--text-dim); font-weight:700; font-size:12px;
  border-bottom:1px solid var(--border); white-space:nowrap;
}
tbody td{padding:11px 14px; border-bottom:1px solid var(--border); white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--surface-2);}
.table-scroll{overflow-x:auto;}
.row-actions{display:flex; gap:6px;}
.empty-state{
  padding:50px 20px; text-align:center; color:var(--text-dim);
}
.empty-state .btn{margin-top:14px;}

.badge{
  display:inline-block; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:700;
}
.badge.b-good{background:rgba(79,156,116,.18); color:var(--good);}
.badge.b-bad{background:rgba(193,84,60,.18); color:var(--bad);}
.badge.b-warn{background:rgba(217,164,65,.18); color:var(--warn);}
.badge.b-neutral{background:var(--surface-2); color:var(--text-dim);}

.toolbar{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center;}
.search-input{
  background:var(--surface); border:1px solid var(--border); color:var(--text);
  padding:8px 12px; border-radius:6px; font-family:inherit; font-size:13px; min-width:200px;
}
.search-input:focus{outline:none; border-color:var(--accent);}

/* ---------- Modal ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.55);
  display:none; align-items:center; justify-content:center; z-index:50; padding:20px;
}
.overlay.open{display:flex;}
.modal{
  background:var(--surface); border:1px solid var(--border); border-radius:8px;
  width:100%; max-width:480px; max-height:88vh; overflow-y:auto;
}
.modal-head{
  padding:18px 20px; border-bottom:1px solid var(--border);
  display:flex; justify-content:space-between; align-items:center;
}
.modal-head h3{font-size:16px; font-weight:800;}
.modal-close{background:none; border:none; color:var(--text-dim); font-size:20px; cursor:pointer; line-height:1;}
.modal-body{padding:18px 20px; display:flex; flex-direction:column; gap:14px;}
.field label{display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:6px; font-weight:500;}
.field input, .field select, .field textarea{
  width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text);
  padding:9px 11px; border-radius:6px; font-family:inherit; font-size:13.5px;
}
.field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--accent);}
.modal-foot{
  padding:16px 20px; border-top:1px solid var(--border);
  display:flex; justify-content:flex-end; gap:10px;
}
#printModalBody table{width:100%; border-collapse:collapse; font-size:13px; margin-top:10px;}
#printModalBody th,#printModalBody td{border:1px solid #999; padding:7px; text-align:right;}
#printModalBody th{background:#eee; color:#000;}
@media print{
  body > *:not(#printOverlay){display:none !important;}
  #printOverlay{position:static !important; background:none !important; padding:0 !important; inset:auto !important; display:block !important;}
  #printOverlay .modal{max-width:100% !important; max-height:none !important; overflow:visible !important; border:none !important; box-shadow:none !important; width:100% !important;}
  #printOverlay .modal-head, #printOverlay .modal-foot{display:none !important;}
  #printOverlay .modal-body{padding:0 !important;}
}

@media(max-width:820px){
  .sidebar{position:fixed; right:-230px; z-index:60; transition:right .2s; box-shadow:0 0 0 2000px rgba(0,0,0,0);}
  .sidebar.open{right:0; box-shadow:-8px 0 24px rgba(0,0,0,.4);}
  main{padding:20px 16px 50px;}
  .menu-btn{display:inline-flex !important;}
}
.menu-btn{
  display:none; align-items:center; justify-content:center;
  width:36px; height:36px; border-radius:6px; border:1px solid var(--border);
  background:var(--surface); color:var(--text); cursor:pointer; margin-left:10px;
}
.topbar{display:flex; align-items:center; margin-bottom:10px;}
@media(min-width:821px){.topbar{display:none;}}

.auth-wrap{
  min-height:100vh; display:none; align-items:center; justify-content:center;
  padding:20px; background:transparent;
}
.auth-card{
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:30px 26px; width:100%; max-width:380px;
}
.user-bar{
  display:flex; justify-content:flex-end; align-items:center; gap:12px;
  padding:4px 0 16px; position:sticky; top:0; background:var(--bg); z-index:20;
  font-size:12.5px; color:var(--text-dim);
}
</style>
</head>
<body>

<div id="bgDecor"></div>

<div class="auth-wrap" id="authScreen"></div>

<div class="app" id="appRoot" style="display:none;">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-title">نظام إدارة المقاولات</div>
      <div class="brand-sub">ERP متكامل للشركة</div>
    </div>
    <nav id="navList"></nav>
    <div class="sidebar-foot">
      <span>تخزين محلي في المتصفح</span>
      <button class="theme-btn" onclick="toggleTheme()">الوضع الداكن/الفاتح</button>
    </div>
  </aside>

  <main>
    <div class="user-bar">
      <span id="userBarName"></span>
      <button class="btn secondary small" onclick="logout()">تسجيل الخروج</button>
    </div>
    <div class="topbar">
      <button class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <div class="brand-title" style="font-size:15px;">نظام إدارة المقاولات</div>
    </div>
    <div id="pages"></div>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">إضافة</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn secondary" onclick="closeModal()">إلغاء</button>
      <button class="btn" onclick="saveRecord()">حفظ</button>
    </div>
  </div>
</div>

<div class="overlay" id="subOverlay">
  <div class="modal" style="max-width:640px;">
    <div class="modal-head">
      <h3 id="subModalTitle">إضافة مقاول باطن</h3>
      <button class="modal-close" onclick="closeSubModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="field"><label>اسم المقاول</label><input id="sub-name" type="text"></div>
      <div class="field"><label>التخصص</label><input id="sub-specialty" type="text" placeholder="مثال: أعمال تشطيبات، حدادة، سباكة..."></div>
      <div class="field"><label>رقم الهاتف</label><input id="sub-phone" type="text"></div>
      <datalist id="projectsList"></datalist>
      <div class="section-title" style="margin:14px 0 8px;">المشاريع المُسند إليها ونظام التعاقد</div>
      <div id="sub-assignments"></div>
      <button type="button" class="btn secondary small" onclick="addAssignmentRow()">+ إضافة مشروع آخر لنفس المقاول</button>
    </div>
    <div class="modal-foot">
      <button class="btn secondary" onclick="closeSubModal()">إلغاء</button>
      <button class="btn" onclick="saveSubRecord()">حفظ</button>
    </div>
  </div>
</div>

<div class="overlay" id="entryOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="entryModalTitle">إضافة بند</h3>
      <button class="modal-close" onclick="closeEntryModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="field"><label>التاريخ</label><input id="entry-date" type="date"></div>
      <div class="field"><label>النوع</label>
        <select id="entry-kind" onchange="updateEntryFieldsContext()">
          <option value="عمل">عمل منفذ</option>
          <option value="دفعة">دفعة مسددة</option>
          <option value="خصم">خصم</option>
          <option value="إضافي">بند إضافي (مواصلات/سكن/إيجار معدات)</option>
          <option value="مكافأة">مكافأة / زيادة عن الاتفاق</option>
        </select>
      </div>
      <div class="field"><label>البيان</label><input id="entry-desc" type="text" placeholder="مثال: يومية العامل أحمد، أو دفعة نقدية"></div>
      <div class="field" id="entry-worker-wrap" style="display:none;">
        <label>اسم العامل/الصنايعي</label>
        <input id="entry-workername" type="text" placeholder="مثال: أحمد">
      </div>
      <div class="field" id="entry-workerrole-wrap" style="display:none;">
        <label>نوع العامل</label>
        <select id="entry-workerrole">
          <option value="عامل">عامل</option>
          <option value="صنايعي">صنايعي</option>
          <option value="مساعد">مساعد</option>
        </select>
      </div>
      <div class="field"><label id="entry-qty-label">الكمية (أيام / أمتار — اختياري)</label><input id="entry-qty" type="number" step="any" oninput="autoCalcEntryAmount()"></div>
      <div class="field"><label id="entry-price-label">السعر (اختياري)</label><input id="entry-price" type="number" oninput="autoCalcEntryAmount()"></div>
      <div class="field"><label>المبلغ (جنيه)</label><input id="entry-amount" type="number"></div>
    </div>
    <div class="modal-foot">
      <button class="btn secondary" onclick="closeEntryModal()">إلغاء</button>
      <button class="btn" onclick="saveEntry()">حفظ</button>
    </div>
  </div>
</div>

<div class="overlay" id="ledgerOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="ledgerModalTitle">إضافة قيد</h3>
      <button class="modal-close" onclick="closeLedgerModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="field"><label>التاريخ</label><input id="ledger-date" type="date"></div>
      <div class="field"><label>النوع</label>
        <select id="ledger-type">
          <option value="إيراد">إيراد</option>
          <option value="مصروف">مصروف</option>
        </select>
      </div>
      <div class="field"><label>الحساب</label>
        <div style="display:flex; gap:6px;">
          <select id="ledger-account" style="flex:1;"></select>
          <button type="button" class="btn secondary small" onclick="toggleNewAccountInput('ledger')">+ جديد</button>
        </div>
        <div id="ledger-new-account-row" style="display:none; gap:6px; margin-top:8px;">
          <input type="text" id="ledger-new-account-name" placeholder="اسم الحساب الجديد" style="flex:1; background:var(--bg); border:1px solid var(--border); color:var(--text); padding:8px 10px; border-radius:6px; font-family:inherit; font-size:13px;">
          <button type="button" class="btn small" onclick="confirmNewAccount('ledger')">إضافة</button>
        </div>
      </div>
      <div class="field"><label>المبلغ (جنيه)</label><input id="ledger-amount" type="number"></div>
      <div class="field"><label>المشروع (اختياري)</label><input id="ledger-project" type="text" list="projectsList"></div>
      <div class="field" id="ledger-phase-wrap" style="display:none;"><label>بند العمل (اختياري)</label><select id="ledger-phase"></select></div>
      <div class="field"><label>البيان</label><input id="ledger-desc" type="text"></div>
    </div>
    <div class="modal-foot">
      <button class="btn secondary" onclick="closeLedgerModal()">إلغاء</button>
      <button class="btn" onclick="saveLedgerRecord()">حفظ</button>
    </div>
  </div>
</div>

<div class="overlay" id="collectionOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="collectionModalTitle">تحصيل إيراد</h3>
      <button class="modal-close" onclick="closeCollectionModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="field"><label>المشروع</label><select id="collection-project"></select></div>
      <div class="field"><label>نوع التحصيل</label>
        <select id="collection-method">
          <option value="نقدي">نقدي</option>
          <option value="شيك">شيك</option>
          <option value="تحويل بنكي">تحويل بنكي</option>
        </select>
      </div>
      <div class="field"><label>المبلغ (جنيه)</label><input id="collection-amount" type="number"></div>
      <div class="field"><label>التاريخ</label><input id="collection-date" type="date"></div>
      <div class="field"><label>ملاحظة (اختياري)</label><input id="collection-note" type="text"></div>
    </div>
    <div class="modal-foot">
      <button class="btn secondary" onclick="closeCollectionModal()">إلغاء</button>
      <button class="btn" onclick="saveCollectionRecord()">حفظ</button>
    </div>
  </div>
</div>

<div class="overlay" id="listSettingsOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="listSettingsTitle">إدارة القائمة</h3>
      <button class="modal-close" onclick="closeListSettings()">×</button>
    </div>
    <div class="modal-body">
      <div id="listSettingsRows"></div>
      <button class="btn secondary small" onclick="addListSettingsRow()">+ إضافة عنصر</button>
    </div>
    <div class="modal-foot">
      <button class="btn secondary" onclick="closeListSettings()">إلغاء</button>
      <button class="btn" onclick="saveListSettings()">حفظ</button>
    </div>
  </div>
</div>

<div class="overlay" id="userOverlay">
  <div class="modal" style="max-width:560px;">
    <div class="modal-head">
      <h3 id="userModalTitle">إضافة مستخدم</h3>
      <button class="modal-close" onclick="closeUserModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="field"><label>الاسم</label><input id="user-name" type="text"></div>
      <div class="field"><label>اسم المستخدم</label><input id="user-username" type="text"></div>
      <div class="field"><label>كلمة المرور</label><input id="user-password" type="password"></div>
      <div class="field"><label>الدور</label>
        <select id="user-role" onchange="togglePermsVisibility()">
          <option value="مستخدم">مستخدم</option>
          <option value="مدير">مدير (صلاحية كاملة)</option>
        </select>
      </div>
      <div id="permsSection">
        <div class="section-title" style="margin:10px 0 8px;">الصلاحيات على كل موديول</div>
        <div id="permsGrid"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn secondary" onclick="closeUserModal()">إلغاء</button>
      <button class="btn" onclick="saveUserRecord()">حفظ</button>
    </div>
  </div>
</div>

<div class="overlay" id="recipientOverlay">
  <div class="modal" style="max-width:440px;">
    <div class="modal-head">
      <h3>إضافة رقم استقبال تنبيهات</h3>
      <button class="modal-close" onclick="closeRecipientForm()">×</button>
    </div>
    <div class="modal-body">
      <div class="field"><label>الاسم (اختياري)</label><input id="recip-name" type="text"></div>
      <div class="field"><label>رقم الواتساب (بالكود الدولي، بدون + أو صفر البداية)</label><input id="recip-phone" type="text" placeholder="مثال: 201021100036" style="direction:ltr; text-align:left;"></div>
    </div>
    <div class="modal-foot">
      <button class="btn secondary" onclick="closeRecipientForm()">إلغاء</button>
      <button class="btn" onclick="saveRecipient()">حفظ</button>
    </div>
  </div>
</div>

<div class="overlay" id="alertRuleOverlay">
  <div class="modal" style="max-width:480px;">
    <div class="modal-head">
      <h3 id="alertRuleModalTitle">إضافة تنبيه جديد</h3>
      <button class="modal-close" onclick="closeAlertRuleForm()">×</button>
    </div>
    <div class="modal-body">
      <div class="field"><label>نوع التنبيه</label>
        <select id="rule-type" onchange="toggleCustomRuleFields()">
          <option value="lowStock">مخزون وصل لحد إعادة الطلب (جاهز)</option>
          <option value="projectDelay">تأخر مشروع عن الجدول الزمني (جاهز)</option>
          <option value="overdueInvoice">فواتير متأخرة (جاهز)</option>
          <option value="budgetOverrun">مشروع تجاوز نسبة من الميزانية (جاهز)</option>
          <option value="custom">— قاعدة جديدة كليًا (تحددها بنفسك) —</option>
        </select>
      </div>
      <div class="field"><label>اسم التنبيه</label><input id="rule-label" type="text" placeholder="اختياري للأنواع الجاهزة، إلزامي للقاعدة المخصصة"></div>

      <div id="customRuleFields" style="display:none; border-top:1px solid var(--border); margin-top:6px; padding-top:12px;">
        <div class="field"><label>مصدر البيانات</label>
          <select id="rule-source" onchange="populateCustomRuleFieldOptions()"></select>
        </div>
        <div class="field"><label>الحقل اللي هيتراقب</label>
          <select id="rule-field" onchange="toggleCustomRuleOperator()"></select>
        </div>
        <div id="customRuleOperatorWrap" class="field" style="display:none;">
          <label>الشرط</label>
          <select id="rule-operator">
            <option value="gte">أكبر من أو يساوي</option>
            <option value="lte">أصغر من أو يساوي</option>
            <option value="gt">أكبر من</option>
